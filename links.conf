# Symlink map applied by install.sh.
#
# One link per line:
#
#   <path inside home/>                 <destination>
#
# The destination accepts ~ and the $HOME and $XDG_CONFIG_HOME variables
# ($XDG_CONFIG_HOME falls back to ~/.config when unset). Blank lines and lines
# starting with # are ignored.
#
# home/ does not mirror $HOME: it is only this repository's layout convention.
# Inside it, home/.config/<tool>/ holds each tool's files, including the ones
# that live outside ~/.config in the home directory (.zshrc, .gitconfig). That
# is why every destination has to be spelled out here.

.config/git/.gitconfig          ~/.gitconfig
.config/zsh/.zshrc              ~/.zshrc
.config/wezterm/wezterm.lua     $XDG_CONFIG_HOME/wezterm/wezterm.lua
